[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-as-code"
version = "0.1.0"
description = "ATS-first CV/resume generation from a single canonical source of truth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Néstor David Fleitas" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resume = "resume_as_code.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
