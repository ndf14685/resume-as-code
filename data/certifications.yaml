# =============================================================================
# CERTIFICATIONS / BADGES  --  SINGLE SOURCE OF TRUTH (FACTS)
# -----------------------------------------------------------------------------
# Every entry carries an explicit `type` and `status`. Only `status: confirmed`
# entries are rendered into a CV or made visible to JD matching; everything else
# is recorded here so it is auditable WITHOUT being claimed.
#
#   type:    certification | badge
#   status:  confirmed          verifiable issuing record (issuer + issue date,
#                               and a credential id when the issuer publishes one)
#            needs_confirmation the credential is visible somewhere (e.g. a badge
#                               rendered in the visual CV) but no issuing record
#                               has been produced. NOT claimable.
#
# A needs_confirmation entry is NOT the same as "the candidate does not have it".
# It is the reason the certification dimension reports UNKNOWN rather than
# UNSUPPORTED when a JD asks for a certification: the sources are incomplete, so
# a negative claim would be as unfounded as a positive one.
#
# Shape for a confirmed entry (do NOT fill with placeholder data):
#   - name: <certification name>
#     issuer: <issuing organization>
#     type: certification
#     status: confirmed
#     issued: "YYYY-MM"
#     expires: "YYYY-MM"   # or null
#     credential_id: null  # omit if not public
# =============================================================================

certifications:
  - name: AWS Certified Cloud Practitioner
    issuer: Amazon Web Services
    type: certification
    status: expired
    evidence: >-
      Badge rendered in the visual CV. The candidate confirmed on 2026-08-25
      that the certification has EXPIRED. No issue or expiry date is recorded
      because none was supplied and none is invented. An expired credential is
      never rendered and never claimable — presenting it as current would be a
      false claim — but it is kept here so the record is not lost.

  - name: Cisco Networking Academy
    issuer: Cisco
    type: badge
    status: needs_confirmation
    evidence: >-
      Badge rendered in the visual CV. The underlying study record that IS
      documented is the CyberOps (2024) program, held in data/training.yaml as
      type: training. The badge is not promoted to a certification here, and
      the training is not promoted to a badge there.
