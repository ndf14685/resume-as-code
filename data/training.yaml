# =============================================================================
# TRAINING / COURSES  --  SINGLE SOURCE OF TRUTH (FACTS)
# -----------------------------------------------------------------------------
# These are training and courses. They are NOT professional certifications and
# are kept strictly separate from data/certifications.yaml. Grouped by provider;
# `year` is omitted when unknown (never invented).
#
# `type` is REQUIRED on every item and is never inferred at render time. The
# vocabulary is closed, and nothing may be promoted from one type to another
# without new evidence:
#
#   training  a structured program run by a provider, with a completion year
#   course    self-paced / short-form course; typically undated
#   badge     a visual credential with no verifiable issuing record  -> these
#             live in certifications.yaml with status: needs_confirmation, NOT
#             here, so a badge can never be read as completed training
#
# A formal certification (issuer, issue date, credential id) belongs in
# data/certifications.yaml with status: confirmed. Nothing in this file may be
# presented as a certification.
# =============================================================================

training:
  # CV label for this provider is "SeaCCNA / Cisco"; the canonical provider name
  # is kept as the academy's own name. Same fact, no conflict.
  - provider: Cisco Networking Academy
    items:
      - { name: CyberOps, year: 2024, type: training }
  - provider: Hackademy
    items:
      - { name: Red Team, year: 2025, type: training }
      - { name: OSINT, year: 2024, type: training }
      - { name: DevSecOps & Cloud Security, year: 2022, type: training }
      - { name: Fundamentals of Hacking and Defense, year: 2022, type: training }
  - provider: MundoSE
    items:
      - { name: Data Science, year: 2023, type: training }
      - { name: DevOps, year: 2022, type: training }
  - provider: Udemy
    items:
      - { name: Docker, type: course }
      - { name: Kubernetes, type: course }
      - { name: Airflow, type: course }
  - provider: Educación IT
    items:
      - { name: Linux, type: course }
      - { name: Java, type: course }
