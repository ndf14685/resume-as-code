# =============================================================================
# CANONICAL SKILLS CATALOG  --  SINGLE SOURCE OF TRUTH
# -----------------------------------------------------------------------------
# This file is the authoritative inventory of skills the candidate has REAL
# evidence for. Every skill referenced by an experience or project MUST exist
# here (the loader enforces this). Presentation layers (profiles / job
# tailoring) may only SELECT and ORDER these skills -- they can never introduce
# a skill that is not listed here. This is a core anti-hallucination control.
#
# `aliases` are lowercase surface forms used to detect the skill inside a Job
# Description during tailoring. They do not change what is claimed.
# =============================================================================

